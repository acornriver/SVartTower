<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>청감 타워</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #04050a; overflow: hidden;
    position: fixed; inset: 0; cursor: none;
    font-family: 'Noto Sans KR', system-ui, sans-serif;
  }
  canvas { display: block; }
  #qr-corner {
    position: fixed; right: 24px; bottom: 72px;
    width: 100px; height: 100px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.7;
  }
  #debug-panel {
    display: none;
    position: fixed; top: 12px; right: 12px;
    background: rgba(0,0,0,0.85); color: #7a7e96;
    font: 11px/1.6 'IBM Plex Mono', monospace;
    padding: 10px 14px; border-radius: 6px; min-width: 220px;
    white-space: pre; z-index: 100;
  }
  #debug-panel.visible { display: block; }
</style>
</head>
<body>
<div id="qr-corner"></div>
<div id="debug-panel"></div>

<!-- 의존성: 순서 중요 -->
<script src="lib/p5.min.js"></script>
<script src="cloud/schema.js"></script>
<script src="cloud/config.js"></script>
<script src="cloud/firebase.js"></script>
<script src="cloud/feed.js"></script>
<script src="mapping.js"></script>
<script>
'use strict';

// ============================================================
// 설정 (config.js의 CloudConfig와 별도로 타워 전용 값)
// ============================================================
const ON_STAGE      = 32;      // 무대 최대 마리 수 (임시, Claude가 정함)
const POOL_MAX      = 500;     // 대기 풀 최대 크기
const ROTATE_EVERY  = 20000;   // 무대 교체 간격 ms (임시, Claude가 정함)
const CARD_EVERY    = 7000;    // 카드 순환 간격 ms (임시, Claude가 정함)
const ARRIVE_QUEUE_GAP = 2000; // 여러 마리가 한꺼번에 올 때 간격 ms
const ARRIVE_CLIMB_MS  = 2000; // 올라오는 시간
const ARRIVE_GROW_MS   = 3000; // 커졌다 돌아오는 시간
const CARD_ARRIVE_HOLD = 10000;// 도착 뒤 카드 고정 시간 ms
const BURNIN_INTERVAL  = 2 * 60 * 1000; // 번인 방지 이동 간격 ms
const BURNIN_DRIFT     = 3;    // 번인 방지 최대 이동 픽셀

const RELOAD_HOUR = 5; // 새벽 5시 새로고침

// 참조 코드에서 그대로 가져온 값
const SEG   = 26;
const SUB   = 3;
const SPEED = 0.8;
const TURNS = 2.6;
const TILT  = 0.36;
const LEAF_STEP  = 0.3;
const SNAIL_BASE = 0.62;
const GLOW_FADE  = 34;
const GLOW_ALPHA = 26;
const GRID  = 16;
const BG    = [4, 5, 10];

const LEAF_RAMP   = [[168, 176, 193], [124, 160, 186], [196, 184, 176], [128, 142, 48], [92, 106, 54]];
// SVart 오실로스코프 스타일 상수
const HELIX = { bodyTwists: [3, 22], shellTwists: [4, 30], sep: 0.075, rungEvery: 3, spinSpeed: 1.4 };
const SHELL_POP = { spring: 0.2, damp: 0.7 };
const RED_DOT = [255, 59, 31];

// ============================================================
// 상태
// ============================================================
let stage   = [];    // 무대 위 Snail 목록 (최대 ON_STAGE)
let pool    = [];    // 대기 풀 (ear 객체, 최근 POOL_MAX개)
let totalCount = 0;
let cardTarget = null;    // 지금 카드에 올린 Snail
let cardTimer  = 0;
let cardArriveLock = 0;   // 도착 카드 고정 해제 시각
let arriveQueue = [];     // { ear, enqueued } 도착 대기열
let rotateTimer = 0;
let debugMode = false;
let burnin = { x: 0, y: 0, nextAt: 0 };

let glow, gridLayer;
let particles = [];
let _p5 = null;

// ============================================================
// p5 스케치
// ============================================================
new p5(function(p) {
  _p5 = p;

  p.setup = function() {
    p.createCanvas(p.windowWidth, p.windowHeight);
    p.pixelDensity(1);
    buildLayers(p);
    scheduleReload();
    acquireWakeLock();
    initFeed();
    initQR();
    initDebug();
    scheduleRotate(p);
  };

  p.windowResized = function() {
    p.resizeCanvas(p.windowWidth, p.windowHeight);
    buildLayers(p);
  };

  p.keyPressed = function() {
    if (p.key === 'f' || p.key === 'F') p.fullscreen(!p.fullscreen());
    if (p.key === 'r' || p.key === 'R') resetAll(p);
    if (p.key === 'd' || p.key === 'D') toggleDebug();
  };

  p.draw = function() {
    const C = cochlea(p);
    const now = p.millis();

    // 도착 대기열 처리
    processArriveQueue(p, now);

    // 무대 교체 체크
    if (now - rotateTimer > ROTATE_EVERY) {
      rotateSingle(p);
      rotateTimer = now;
    }

    // 카드 순환
    if (now > cardArriveLock && now - cardTimer > CARD_EVERY) {
      advanceCard();
      cardTimer = now;
    }

    for (const sn of stage) sn.update(C, p);

    // ── 그리기 ──
    // 발광 레이어
    glow.blendMode(p.BLEND);
    glow.noStroke();
    glow.fill(0, GLOW_FADE);
    glow.rect(0, 0, p.width, p.height);
    glow.blendMode(p.ADD);
    for (const sn of stage) sn.drawGlow(glow, p);

    p.blendMode(p.BLEND);
    const bx = burnin.x, by = burnin.y;
    p.image(gridLayer, bx, by);

    // 깊이 순서 정렬
    const items = [];
    for (const lf of C.leaves) items.push({ kind: 'leaf', o: lf, front: lf.front, key: lf.key });
    for (const sn of stage)    items.push({ kind: 'snail', o: sn, front: sn.front, key: sn.key });
    const back  = items.filter(it => !it.front).sort((a, b) => a.key - b.key);
    const front = items.filter(it =>  it.front).sort((a, b) => a.key - b.key);

    drawItems(back, p);
    drawColumn(C, p);
    drawItems(front, p);

    p.blendMode(p.ADD);
    p.image(glow, 0, 0);
    p.blendMode(p.BLEND);
    drawParticles(p);

    drawTonotopy(C, p, bx, by);
    drawCard(p, bx, by);
    drawFooter(p, bx, by);

    // 번인 방지
    if (now > burnin.nextAt) {
      burnin.x += Math.round((Math.random() - 0.5) * BURNIN_DRIFT * 2);
      burnin.y += Math.round((Math.random() - 0.5) * BURNIN_DRIFT * 2);
      burnin.x = Math.max(-BURNIN_DRIFT, Math.min(BURNIN_DRIFT, burnin.x));
      burnin.y = Math.max(-BURNIN_DRIFT, Math.min(BURNIN_DRIFT, burnin.y));
      burnin.nextAt = now + BURNIN_INTERVAL;
    }

    updateDebug(p);
  };
});

// ============================================================
// 피드 초기화
// ============================================================
function initFeed() {
  // 오프라인이거나 Firebase 실패 시 캐시에서 초기화
  const cached = window.svartFeed?.getFeedCache?.() || [];
  if (cached.length > 0) {
    _onInitial(cached);
  }

  window.svartFeed.startFeed({
    onInitial: _onInitial,
    onArrive:  _onArrive,
    onRemove:  _onRemove,
    onCount:   _onCount
  });
}

function _onInitial(list) {
  // 이미 처리된 ID가 있으면 중복 방지
  const existing = new Set([...stage.map(s => s.earId), ...pool.map(e => e.earId)]);
  const fresh = list.filter(e => !existing.has(e.earId));
  // 풀에 넣고 무대 채우기
  pool = [...fresh, ...pool].slice(0, POOL_MAX);
  while (stage.length < ON_STAGE && pool.length > 0) {
    const ear = pool.shift();
    _addToStage(ear, true, _p5);
  }
}

function _onArrive(ear, { animate }) {
  if (!animate) {
    // 연출 없이 풀에만
    pool.unshift(ear);
    if (pool.length > POOL_MAX) pool.pop();
    return;
  }
  // 도착 대기열에 추가
  arriveQueue.push({ ear, enqueued: performance.now() });
}

function _onRemove(earId) {
  // 무대에서 즉시 제거
  const idx = stage.findIndex(s => s.earId === earId);
  if (idx >= 0) {
    stage.splice(idx, 1);
    if (cardTarget?.earId === earId) {
      cardTarget = null;
      cardTimer = 0;
    }
    // 풀에서 하나 무대에 올리기
    _fillStage(_p5);
  }
  // 풀에서도 제거
  pool = pool.filter(e => e.earId !== earId);
}

function _onCount(total) {
  totalCount = total;
}

// ============================================================
// 무대 관리
// ============================================================
function _addToStage(ear, atHome, p) {
  if (!p) return;
  const pf = window.TowerMapping.mapProfile(ear.profile);
  const sn = new Snail(pf, ear, atHome, p);
  stage.push(sn);
}

function _fillStage(p) {
  while (stage.length < ON_STAGE && pool.length > 0) {
    const ear = pool.shift();
    _addToStage(ear, true, p);
  }
}

function processArriveQueue(p, now) {
  if (arriveQueue.length === 0) return;

  // 가장 먼저 큐에 들어온 것만 처리 (2초 간격)
  const item = arriveQueue[0];
  const elapsed = performance.now() - item.enqueued;
  if (elapsed < 0) { arriveQueue.shift(); return; } // 이미 처리됨

  arriveQueue.shift();

  // 무대가 꽉 차면 가장 오래된 것 퇴장
  if (stage.length >= ON_STAGE) {
    const oldest = stage.shift();
    if (oldest && cardTarget?.earId === oldest.earId) {
      cardTarget = null;
    }
  }

  // 무대에 추가 (입구에서 올라오는 연출)
  _addToStage(item.ear, false, p);
  const newSn = stage[stage.length - 1];
  if (newSn) {
    newSn.arriving = true;
    newSn.arriveStart = p.millis();
    // 카드 고정
    cardTarget = newSn;
    cardArriveLock = p.millis() + CARD_ARRIVE_HOLD;
    cardTimer = p.millis();
  }

  // 다음 대기열 처리는 2초 뒤
  if (arriveQueue.length > 0) {
    const next = arriveQueue[0];
    next.enqueued = performance.now() + ARRIVE_QUEUE_GAP;
  }
}

function rotateSingle(p) {
  if (stage.length === 0 || pool.length === 0) return;
  // 가장 오래 무대에 있던 1마리 퇴장
  const departed = stage.shift();
  if (departed && cardTarget?.earId === departed.earId) {
    cardTarget = null;
    cardTimer = 0;
  }
  // 풀에서 아직 안 나온 1마리 입장
  const ear = pool.shift();
  _addToStage(ear, true, p);
}

function scheduleRotate(p) {
  rotateTimer = p.millis();
}

function resetAll(p) {
  stage = [];
  pool = [];
  particles = [];
  cardTarget = null;
  arriveQueue = [];
  buildLayers(p);
}

// ============================================================
// 카드 순환
// ============================================================
function advanceCard() {
  if (stage.length === 0) { cardTarget = null; return; }
  if (stage.length === 1) { cardTarget = stage[0]; return; }
  // 같은 달팽이가 연달아 나오지 않게
  const others = stage.filter(s => s !== cardTarget);
  cardTarget = others[Math.floor(Math.random() * others.length)];
}

// ============================================================
// 달팽이관 형상 (참조 코드 그대로)
// ============================================================
function cochlea(p) {
  const S_MAX = TURNS * p.TWO_PI;
  const cx = p.width / 2;
  const baseY = p.height * 0.84;
  const R0 = p.min(p.width * 0.36, p.height * 0.46);
  const H  = p.height * 0.6;
  const rot = p.millis() / 1000 * 0.02;
  const geo = {
    S_MAX, cx, baseY, R0, H, rot,
    r: s => R0 * (1 - 0.74 * (s / S_MAX)),
    z: s => H * Math.pow(s / S_MAX, 0.92)
  };
  geo.proj = (s, rk = 1, dz = 0) => {
    const a = s + rot;
    const r = geo.r(s) * rk;
    return { x: cx + p.cos(a) * r, y: baseY - geo.z(s) - dz + p.sin(a) * r * TILT, depth: p.sin(a) };
  };
  geo.leaves = makeLeaves(geo, p);
  return geo;
}

function makeLeaves(C, p) {
  const out = [];
  const light = -2.3;
  for (let s = 0.15; s < C.S_MAX - 0.2; s += LEAF_STEP * (0.75 + 0.25 * (1 - s / C.S_MAX))) {
    const u = s / C.S_MAX;
    const a = s + C.rot;
    const r = C.r(s);
    const rIn = r * 0.5, rOut = r * 1.02;
    const half = r * 0.2;
    const sway = p.sin(p.millis() / 1300 + s * 2) * 0.03;
    const pts = [], vein = [];
    const side = sign => {
      for (let k = 0; k <= 10; k++) {
        const v = sign > 0 ? k / 10 : 1 - k / 10;
        const rv = p.lerp(rIn, rOut, v);
        const w = half * Math.pow(p.sin(p.PI * v), 0.75) * (v < 0.5 ? 0.9 : 1);
        const av = a + v * 0.32 + sway + sign * (w / rv);
        const z = C.z(s) - v * r * 0.06;
        pts.push({ x: C.cx + p.cos(av) * rv, y: C.baseY - z + p.sin(av) * rv * TILT });
      }
    };
    side(1); side(-1);
    for (let k = 0; k <= 8; k++) {
      const v = k / 8, rv = p.lerp(rIn, rOut, v), av = a + v * 0.32 + sway;
      vein.push({ x: C.cx + p.cos(av) * rv, y: C.baseY - (C.z(s) - v * r * 0.06) + p.sin(av) * rv * TILT });
    }
    const facing = 0.72 + 0.28 * p.cos(a - light);
    const depthK = p.sin(a) < 0 ? 0.5 + 0.2 * (1 + p.sin(a)) : 0.85 + 0.15 * p.sin(a);
    const col = rampColor(LEAF_RAMP, u).map(c => c * facing * depthK);
    out.push({
      pts, vein, col,
      front: p.sin(a) >= 0,
      key:   p.sin(a) * r + (p.sin(a) >= 0 ? -C.z(s) * 0.4 : C.z(s) * 0.4),
      alpha: p.sin(a) < 0 ? 0.75 : 0.93
    });
  }
  return out;
}

// ============================================================
// 그리기 헬퍼
// ============================================================
function drawItems(list, p) {
  for (const it of list) {
    if (it.kind === 'leaf') {
      drawLeaf(it.o, p);
    } else {
      p.drawingContext.globalAlpha = it.o.alpha;
      const isCard = (it.o === cardTarget);
      it.o.draw(isCard, p);
      p.drawingContext.globalAlpha = 1;
    }
  }
}

function drawLeaf(lf, p) {
  p.noStroke();
  p.fill(lf.col[0], lf.col[1], lf.col[2], 255 * lf.alpha);
  p.beginShape();
  for (const pt of lf.pts) p.vertex(pt.x, pt.y);
  p.endShape(p.CLOSE);
  p.noFill();
  p.stroke(Math.min(255, lf.col[0] * 1.35), Math.min(255, lf.col[1] * 1.35), Math.min(255, lf.col[2] * 1.35), 150 * lf.alpha);
  p.strokeWeight(1);
  p.beginShape();
  for (const pt of lf.pts) p.vertex(pt.x, pt.y);
  p.endShape(p.CLOSE);
  p.stroke(lf.col[0] * 0.55, lf.col[1] * 0.55, lf.col[2] * 0.55, 200 * lf.alpha);
  p.strokeWeight(1.2);
  for (let k = 0; k < lf.vein.length - 1; k++)
    p.line(lf.vein[k].x, lf.vein[k].y, lf.vein[k + 1].x, lf.vein[k + 1].y);
}

function drawColumn(C, p) {
  const top = C.proj(C.S_MAX - 0.2, 0);
  const wB = C.R0 * 0.42, wT = C.R0 * 0.08;
  p.noStroke(); p.fill(18, 20, 28, 235);
  p.beginShape();
  p.vertex(C.cx - wB, C.baseY); p.vertex(C.cx - wT, top.y);
  p.vertex(C.cx + wT, top.y);  p.vertex(C.cx + wB, C.baseY);
  p.endShape(p.CLOSE);
  p.stroke(60, 64, 80, 120); p.strokeWeight(1);
  for (let k = -3; k <= 3; k++)
    p.line(C.cx + (k / 3) * wB * 0.8, C.baseY, C.cx + (k / 3) * wT * 0.8, top.y);
}

function drawTonotopy(C, p, bx, by) {
  // b = 달팽이관 기저부(아래쪽) = 저음, t = 꼭짓점(위쪽) = 고음
  const b = C.proj(0.05, 1.08), t = C.proj(C.S_MAX - 0.3, 1.4);
  p.noStroke(); p.fill(130, 134, 152);
  p.textFont('Noto Sans KR, system-ui, sans-serif');
  p.textSize(12);
  p.textAlign(p.LEFT, p.CENTER);
  p.text('낮은 소리', b.x + bx + 10, b.y + by);
  p.textAlign(p.LEFT, p.BOTTOM);
  p.text('높은 소리', t.x + bx + 20, t.y + by - 24);
}

// ============================================================
// 정보 카드
// ============================================================
function drawCard(p, bx, by) {
  if (!cardTarget) return;
  const sn  = cardTarget;
  const cfg = window.CloudConfig;
  const ear = sn.ear;
  const pf  = sn.pf;
  const d   = pf._display || {};
  const isArriving = sn.arriving && (p.millis() - sn.arriveStart < CARD_ARRIVE_HOLD);

  const lines = [
    ['청감 코드', ear.code || '—'],
    ['볼륨 → 크기',       d.volDb],
    ['음역',              d.register],
    ['저음',              d.lowDb],
    ['고음',              d.highDb],
    ['최고 주파수 → 꼬임', d.maxFreqHz],
    ['우세 귀',           d.dominantEar],
    ['중앙 → 선 색',      d.centerDeg],
    ['바탕음·배음',       d.pitchMode],
  ];

  // SHOW_NAMES가 true고 이름이 있으면 첫 줄에 추가
  if (cfg.SHOW_NAMES && ear.name) {
    // 금칙어 필터 (config.BANNED_WORDS)
    let name = ear.name;
    if (Array.isArray(cfg.BANNED_WORDS)) {
      for (const w of cfg.BANNED_WORDS) {
        name = name.replace(new RegExp(w, 'gi'), '*'.repeat(w.length));
      }
    }
    lines.unshift(['이름', name.slice(0, cfg.NAME_MAX_LEN || 12)]);
  }

  const lh = 22, w = 260, h = lines.length * lh + 56;
  let x = sn.shellPos.x + sn.R * 1.4 + bx;
  let y = sn.shellPos.y - h / 2 + by;
  if (x + w > p.width - 12) x = sn.shellPos.x - sn.R * 1.4 - w + bx;
  x = p.constrain(x, 12, p.width - w - 12);
  y = p.constrain(y, 12, p.height - h - 60);

  // 카드 배경
  p.noStroke(); p.fill(10, 12, 20, 235);
  p.rect(x, y, w, h, 12);

  // 하이라이트 링
  p.noFill(); p.stroke(245, 245, 243, 100); p.strokeWeight(1.5);
  p.circle(sn.shellPos.x + bx, sn.shellPos.y + by, sn.R * 2.6);

  // 도착 표시
  if (isArriving) {
    p.noStroke(); p.fill(255, 80, 40, 220);
    p.textFont('Noto Sans KR, system-ui, sans-serif');
    p.textSize(10); p.textAlign(p.CENTER, p.TOP);
    p.text('▶ 방금 도착', x + w / 2, y + 8);
  }

  // 선 색 띠 (sn.ink 기반)
  const [ir, ig, ib] = sn.ink;
  for (let k = 0; k < w - 32; k++) {
    const a = 80 + 120 * Math.abs(Math.sin(Math.PI * k / (w - 33)));
    p.fill(ir, ig, ib, a);
    p.rect(x + 16 + k, y + (isArriving ? 24 : 16), 1.2, 6);
  }

  // 내용
  p.textFont('Noto Sans KR, system-ui, sans-serif');
  p.textSize(12);
  lines.forEach(([label, val], i) => {
    const yy = y + (isArriving ? 44 : 40) + i * lh;
    p.textAlign(p.LEFT, p.CENTER); p.fill(112, 116, 138);
    p.text(label, x + 16, yy);
    p.textAlign(p.RIGHT, p.CENTER); p.fill(234, 236, 246);
    p.text(val || '—', x + w - 16, yy);
  });
}

// ============================================================
// 하단 문구
// ============================================================
function drawFooter(p, bx, by) {
  p.noStroke(); p.fill(112, 116, 138);
  p.textFont('Noto Sans KR, system-ui, sans-serif');
  p.textSize(13);
  p.textAlign(p.LEFT, p.BOTTOM);
  const countStr = totalCount > 0 ? `달팽이 ${totalCount}마리` : `달팽이 ${stage.length}마리`;
  p.text('청감 타워 · ' + countStr, 20 + bx, p.height - 18 + by);
  p.textAlign(p.RIGHT, p.BOTTOM);
  p.text('모든 귀는 [ ] 이다', p.width - 20 + bx, p.height - 18 + by);
}

// ============================================================
// 파티클
// ============================================================
function drawParticles(p) {
  p.noStroke();
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy;
    pt.vx *= 0.95; pt.vy *= 0.95;
    pt.rot += pt.spin;
    pt.life -= pt.decay;
    if (pt.life <= 0) { particles.splice(i, 1); continue; }
    const tw = 0.55 + 0.45 * p.sin(p.frameCount * 0.25 + pt.tw);
    const a = 255 * pt.life * (pt.spin !== 0 ? tw : 1);
    p.fill(pt.c[0], pt.c[1], pt.c[2], a);
    p.push(); p.translate(pt.x, pt.y); p.rotate(pt.rot);
    drawShape(pt.shape, pt.size * (0.6 + 0.4 * pt.life), p);
    p.pop();
  }
  if (particles.length > 2500) particles.splice(0, particles.length - 2500);
}

// pitchMode → 슬라임 모양: F=sq, H=circle, B=50/50, null=circle
function drawShape(shape, s, p) {
  if (shape === 'sq') {
    const h = s * 0.45;
    p.rect(-h, -h, h * 2, h * 2, 2);
  } else {
    p.circle(0, 0, s * 0.9);
  }
}

// ============================================================
// 배경 레이어 빌드
// ============================================================
function buildLayers(p) {
  glow = p.createGraphics(p.width, p.height);
  glow.pixelDensity(1);
  glow.background(0);

  gridLayer = p.createGraphics(p.width, p.height);
  gridLayer.pixelDensity(1);
  gridLayer.background(BG[0], BG[1], BG[2]);
  gridLayer.noStroke(); gridLayer.fill(24);
  for (let y = GRID / 2; y < p.height; y += GRID)
    for (let x = GRID / 2; x < p.width; x += GRID)
      gridLayer.circle(x, y, 2);
}

// ============================================================
// 색 헬퍼 (참조 코드 그대로)
// ============================================================
function rampColor(ramp, t) {
  t = Math.max(0, Math.min(1, t)) * (ramp.length - 1);
  const i = Math.min(Math.floor(t), ramp.length - 2);
  const f = t - i;
  return ramp[i].map((c, k) => c + f * (ramp[i + 1][k] - c));
}

function gradAt(stops, t) {
  const P = [0, 0.33, 0.67, 1];
  t = Math.max(0, Math.min(1, t));
  let i = 0;
  while (i < 2 && t > P[i + 1]) i++;
  let f = (t - P[i]) / (P[i + 1] - P[i]);
  f = f * f * (3 - 2 * f);
  return stops[i].map((v, j) => v + f * (stops[i + 1][j] - v));
}

// ============================================================
// SVart 오실로스코프 스타일 렌더 헬퍼
// ============================================================

// canvas2d 그림자 글로우 + 얇은 선 (scopeStroke 포트)
function scopeLine(pts, ink, weight, alpha, p) {
  if (pts.length < 2) return;
  const dc = p.drawingContext;
  dc.save();
  dc.globalAlpha = alpha;
  dc.shadowBlur = 10;
  dc.shadowColor = `rgba(${ink[0]},${ink[1]},${ink[2]},0.45)`;
  dc.strokeStyle = `rgb(${ink[0]},${ink[1]},${ink[2]})`;
  dc.lineWidth = weight;
  dc.lineJoin = 'round';
  dc.lineCap = 'round';
  dc.beginPath();
  dc.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) dc.lineTo(pts[i].x, pts[i].y);
  dc.stroke();
  dc.restore();
}

// 이중나선 — spine 경로를 따라 두 가닥 + 가로 연결선 (helixStroke 포트)
function helixStroke(spine, R, chir, twist, ink, alpha, p) {
  if (spine.length < 2) return;
  const sep = HELIX.sep;
  const pts_a = [], pts_b = [];
  for (let i = 0; i < spine.length; i++) {
    const prev = spine[Math.max(0, i - 1)], next = spine[Math.min(spine.length - 1, i + 1)];
    const tgx = next.x - prev.x, tgy = next.y - prev.y;
    const len = Math.hypot(tgx, tgy) || 1;
    const nx = -tgy / len, ny = tgx / len;
    const ph = twist + chir * i * 0.38;
    const off = R * sep * Math.sin(ph);
    pts_a.push({ x: spine[i].x + nx * off, y: spine[i].y + ny * off });
    pts_b.push({ x: spine[i].x - nx * off, y: spine[i].y - ny * off });
  }
  scopeLine(pts_a, ink, 1.2, alpha, p);
  scopeLine(pts_b, ink, 1.2, alpha, p);
  // 가로 연결선
  const rungEvery = HELIX.rungEvery;
  const dc = p.drawingContext;
  dc.save();
  dc.globalAlpha = alpha * 0.6;
  dc.strokeStyle = `rgb(${ink[0]},${ink[1]},${ink[2]})`;
  dc.lineWidth = 0.8;
  for (let i = 0; i < spine.length; i += rungEvery) {
    dc.beginPath();
    dc.moveTo(pts_a[i].x, pts_a[i].y);
    dc.lineTo(pts_b[i].x, pts_b[i].y);
    dc.stroke();
  }
  dc.restore();
}

// ============================================================
// Snail 클래스 (SVart 오실로스코프 스타일)
// ============================================================
class Snail {
  constructor(pf, ear, atHome, p) {
    this.pf    = pf;
    this.ear   = ear;
    this.earId = ear.earId;
    this.p     = p;

    // 선 색 (⑥ centerDeg → SNAIL_PALETTE)
    this.ink = pf.inkRGB || [245, 245, 243];

    // 크기 (볼륨 → 배율)
    this.vol = p.map(pf.volDb, -40, 0, 0.55, 1.05, true);

    // 꼬임 (⑤ maxFreqHz → 나선 밀도)
    // twistU: 0=저역(느슨), 1=고역(촘촘)
    this.chir       = pf.dominantEar === 'LEFT' ? -1 : 1;
    this.twistSpeed = p.map(pf.twistU ?? 0.5, 0, 1, 0.012, 0.05);
    this.period     = p.map(pf.twistU ?? 0.5, 0, 1, 74, 26);

    // 슬라임 모양 (⑧ pitchMode)
    const pm = pf.pitchMode;
    this.slimeShape = pm === 'F' ? 'sq' : pm === 'B' ? (Math.random() < 0.5 ? 'sq' : 'circle') : 'circle';

    // 껍질 모양 플래그 (⑦ dominantEar → shellSquare)
    this.shellSquare = pf.shellSquare ?? 0;

    // 위치 — 등록 선호도로 잎 자리 결정
    const pref = Math.max(0.03, Math.min(0.97,
      ((pf.highDb - pf.lowDb + 20) / 40) + (Math.random() - 0.5) * 0.16));
    this.home  = (1 - pref) * TURNS * p.TWO_PI * 0.9 + 0.3;
    this.sPos  = atHome ? this.home + (Math.random() - 0.5) : 0.2;
    this.dir   = atHome ? (Math.random() < 0.5 ? 1 : -1) : 1;

    this.s = 0.5;
    this._applyScale(1, p);
    this.seed       = p.random(1000);
    this.speed      = SPEED * p.random(0.7, 1.2);
    this.twist      = p.random(p.TWO_PI);
    this.head       = p.createVector(p.width / 2, p.height / 2);
    this.vel        = p.createVector(1, 0);
    this.spine      = null;
    this.shellPos   = p.createVector(p.width / 2, p.height / 2);
    this.shellVel   = 0; // SHELL_POP 용
    this.alpha      = 1;
    this.front      = true;
    this.key        = 0;

    // 도착 연출
    this.arriving    = false;
    this.arriveStart = 0;
    this.arriveScale = 1;
  }

  _applyScale(k, p) {
    this.s      = SNAIL_BASE * this.vol * k;
    this.segLen = 10 * this.s;
    this.bodyW  = 38 * this.s;
    this.R      = 74 * this.s;
  }

  _resetSpine(p) {
    this.spine = [];
    const back = this.vel.copy().mult(-this.segLen);
    for (let i = 0; i < SEG; i++)
      this.spine.push(p5.Vector.add(this.head, p5.Vector.mult(back, i)));
    this.shellPos = this.head.copy();
  }

  update(C, p) {
    const now = p.millis();

    let speedMult = 1;
    if (this.arriving) {
      const elapsed = now - this.arriveStart;
      if (elapsed < ARRIVE_CLIMB_MS) {
        speedMult = 4; this.arriveScale = 1;
      } else if (elapsed < ARRIVE_CLIMB_MS + ARRIVE_GROW_MS) {
        const t = (elapsed - ARRIVE_CLIMB_MS) / ARRIVE_GROW_MS;
        this.arriveScale = 1 + 0.6 * Math.sin(t * Math.PI);
        speedMult = 0.3;
      } else {
        this.arriving = false; this.arriveScale = 1;
      }
    }

    const far = Math.abs(this.sPos - this.home) > 0.9;
    if (far) this.dir = this.sPos < this.home ? 1 : -1;
    else if (Math.abs(this.sPos - this.home) > 0.6 && (this.sPos - this.home) * this.dir > 0)
      this.dir *= -1;

    const r = C.r(this.sPos);
    const pulse = this.speed * (0.7 + 0.5 * (0.5 + 0.5 * p.sin((p.frameCount + this.seed) * 0.1))) * (far ? 2.6 : 1) * speedMult;
    this.sPos = Math.max(0.1, Math.min(C.S_MAX - 0.3, this.sPos + (this.dir * pulse) / r));

    this._applyScale(Math.pow(r / C.R0, 0.7) * this.arriveScale, p);
    const pt  = C.proj(this.sPos, 0.8, 4);
    const pt2 = C.proj(this.sPos + this.dir * 0.02, 0.8, 4);
    this.head.set(pt.x, pt.y);
    const v = p.createVector(pt2.x - pt.x, pt2.y - pt.y);
    if (v.magSq() > 0) this.vel = v.normalize();
    if (!this.spine) this._resetSpine(p);

    this.spine[0].set(this.head);
    for (let i = 1; i < SEG; i++) {
      const d = p5.Vector.sub(this.spine[i], this.spine[i - 1]);
      d.setMag(this.segLen);
      this.spine[i] = p5.Vector.add(this.spine[i - 1], d);
    }
    this.twist += this.twistSpeed;
    this.front = pt.depth >= 0;
    this.alpha = this.front ? 1 : 0.42 + 0.3 * (1 + pt.depth);
    this.key   = pt.depth * r + (this.front ? -C.z(this.sPos) * 0.4 : C.z(this.sPos) * 0.4) + 0.5;

    // 껍질 위치 업데이트 (SHELL_POP 스프링)
    const fr = this.spine[Math.floor(SEG * 0.4)];
    if (fr) {
      const n0 = p.createVector(-this.vel.y, this.vel.x);
      const upSide = n0.y > 0 ? -1 : 1;
      const nScaled = n0.copy().mult(upSide);
      const targetX = fr.x + nScaled.x * (this.bodyW * 0.7 + this.R * 0.8);
      const targetY = fr.y + nScaled.y * (this.bodyW * 0.7 + this.R * 0.8);
      this.shellPos.lerp({ x: targetX, y: targetY }, 0.25);
    }

    this._emit(p);
  }

  drawGlow(g, p) {
    if (!this.spine) return;
    const [ir, ig, ib] = this.ink;
    const k = this.alpha;
    // 몸통 글로우
    g.noFill(); g.stroke(ir, ig, ib, GLOW_ALPHA * k); g.strokeWeight(5 * this.s);
    g.beginShape();
    for (const pt of this.spine) g.vertex(pt.x, pt.y);
    g.endShape();
    // 껍질 글로우
    g.stroke(ir, ig, ib, GLOW_ALPHA * 0.7 * k); g.strokeWeight(8 * this.s);
    const cx = this.shellPos.x, cy = this.shellPos.y;
    const T = 2.9 * p.TWO_PI, bb = Math.log(this.R / Math.max(1, 4 * this.s)) / T;
    g.beginShape();
    for (let th = 1.3; th <= T; th += 0.25) {
      const r = this.R * Math.exp(bb * (th - T));
      g.vertex(cx + Math.cos(th) * r, cy + Math.sin(th) * r);
    }
    g.endShape();
  }

  _emit(p) {
    if (!this.spine) return;
    if ((p.frameCount + Math.floor(this.seed)) % 7 !== 0) return;
    const tail = this.spine[SEG - 1];
    const [ir, ig, ib] = this.ink;
    const isWhite = Math.random() < 0.2;
    particles.push({
      x: tail.x + p.random(-3, 3) * this.s,
      y: tail.y + p.random(-3, 3) * this.s,
      vx: 0, vy: 0,
      life: 1, decay: 0.0032,
      size: p.random(3, 5) * (0.6 + this.s * 0.6),
      rot: p.random(p.TWO_PI), spin: 0,
      shape: this.slimeShape,
      c: isWhite ? [245, 245, 243] : [ir, ig, ib],
      tw: p.random(p.TWO_PI)
    });
  }

  draw(hi, p) {
    if (!this.spine) return;
    const alpha = this.alpha;

    // 몸통: 이중나선
    helixStroke(this.spine.map(v => ({ x: v.x, y: v.y })),
      this.bodyW, this.chir, this.twist, this.ink, alpha, p);

    // 껍질
    this._drawShell(hi, p, alpha);

    // 더듬이
    this._drawAntennae(p, alpha);

    // 카드 하이라이트 링
    if (hi) {
      p.noFill(); p.stroke(245, 245, 243, 100); p.strokeWeight(1);
      p.circle(this.shellPos.x, this.shellPos.y, this.R * 2.5);
    }
  }

  _drawShell(hi, p, alpha) {
    const cx = this.shellPos.x, cy = this.shellPos.y;
    const R = this.R;
    const T = 2.9 * p.TWO_PI;
    const bb = Math.log(R / Math.max(1, 4 * this.s)) / T;
    const sg = this.chir > 0 ? 1 : -1;
    const pts = [];
    for (let th = 1.3; th <= T; th += 0.07) {
      const r = R * Math.exp(bb * (th - T));
      pts.push({ x: cx + Math.cos(sg * th) * r, y: cy + Math.sin(sg * th) * r });
    }

    if (this.shellSquare) {
      // 우세 귀 LEFT → 네모 껍질 (각진 나선)
      scopeLine(pts, this.ink, 1.4, alpha, p);
      // 꼭짓점에만 흰 점
      if (pts.length > 10) {
        const tip = pts[pts.length - 1];
        const dc = p.drawingContext;
        dc.save(); dc.globalAlpha = alpha;
        dc.fillStyle = `rgb(245,245,243)`;
        dc.beginPath(); dc.rect(tip.x - 2, tip.y - 2, 4, 4); dc.fill();
        dc.restore();
      }
    } else {
      // 우세 귀 RIGHT → 둥근 껍질 (이중나선)
      helixStroke(pts, R * 0.1, sg, this.twist * 0.6, this.ink, alpha, p);
    }
  }

  _drawAntennae(p, alpha) {
    if (!this.spine || this.spine.length < 2) return;
    const head = this.spine[0];
    const fwd  = this.vel;
    const t    = p.frameCount * 0.03 + this.seed;
    const up   = p.createVector(-fwd.y, fwd.x);
    // 항상 오른쪽을 보는 달팽이 → 더듬이는 이동 방향 앞 위로
    const dirs = [
      p5.Vector.add(p5.Vector.mult(fwd, 0.5), up).normalize(),
      p5.Vector.add(fwd, p5.Vector.mult(up, 0.9)).normalize()
    ];
    const [ir, ig, ib] = this.ink;
    const dc = p.drawingContext;
    dc.save();
    dc.globalAlpha = alpha;
    dc.strokeStyle = `rgb(${ir},${ig},${ib})`;
    dc.lineWidth = Math.max(0.8, 1.4 * this.s);
    dc.lineCap = 'round';

    dirs.forEach((d, i) => {
      const sway = Math.sin(t + i) * 0.15;
      const ang  = Math.atan2(d.y, d.x) + sway;
      const len  = (i === 0 ? 70 : 58) * this.s;
      const ex   = head.x + Math.cos(ang) * len;
      const ey   = head.y + Math.sin(ang) * len;
      dc.beginPath(); dc.moveTo(head.x, head.y); dc.lineTo(ex, ey); dc.stroke();
      // 빨간 점
      dc.fillStyle = `rgb(${RED_DOT[0]},${RED_DOT[1]},${RED_DOT[2]})`;
      dc.beginPath(); dc.arc(ex, ey, 3.5 * this.s, 0, Math.PI * 2); dc.fill();
    });
    dc.restore();
  }
}

// ============================================================
// 디버그
// ============================================================
function initDebug() {
  // 디버그 패널은 D 키로 토글 — 별도 초기화 없음
}

function toggleDebug() {
  debugMode = !debugMode;
  document.getElementById('debug-panel').classList.toggle('visible', debugMode);
}

function updateDebug(p) {
  if (!debugMode) return;
  const panel = document.getElementById('debug-panel');
  panel.textContent = [
    `fps: ${p.frameRate().toFixed(1)}`,
    `무대: ${stage.length}/${ON_STAGE}`,
    `풀: ${pool.length}`,
    `파티클: ${particles.length}`,
    `총: ${totalCount}`,
    `도착 대기: ${arriveQueue.length}`,
    `피드 재연결: ${window._feedReconnectCount ?? 0}`,
    `번인: (${burnin.x}, ${burnin.y})`,
    `mock: ${location.search.includes('mock=1')}`,
    `emulator: ${location.search.includes('emulator=1')}`,
  ].join('\n');
}

// ============================================================
// 장시간 운영
// ============================================================
function acquireWakeLock() {
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').catch(() => {});
  }
}

function scheduleReload() {
  function checkReload() {
    const now = new Date();
    if (now.getHours() === RELOAD_HOUR && now.getMinutes() === 0) {
      // 페이지를 받을 수 있는지 확인 후 새로고침
      fetch(location.href, { method: 'HEAD', cache: 'no-cache' })
        .then(r => { if (r.ok) location.reload(); })
        .catch(() => {}); // 실패하면 건너뜀
    }
  }
  setInterval(checkReload, 60000);
}

// ============================================================
// QR
// ============================================================
function initQR() {
  const url = window.CloudConfig?.MOBILE_URL;
  if (!url) return;
  const el = document.getElementById('qr-corner');
  // QR 라이브러리가 있으면 생성, 없어도 타워는 동작
  if (typeof QRCode !== 'undefined') {
    try {
      new QRCode(el, {
        text: url, width: 100, height: 100,
        colorDark: '#c8cae0', colorLight: '#04050a',
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch (e) {}
  }
}

// ============================================================
// 디버그용 전역 (D 키 외에도 콘솔에서 접근 가능)
// ============================================================
window._towerDebug = {
  get stage()  { return stage; },
  get pool()   { return pool; },
  get queue()  { return arriveQueue; },
  get total()  { return totalCount; },
};
