<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>청감 타워 · 관객용</title>
  <link rel="stylesheet" href="mobile/mobile.css">
  <script defer src="cloud/schema.js"></script>
  <script defer src="cloud/config.js"></script>
  <script defer src="cloud/firebase.js"></script>
  <script defer src="cloud/feed.js"></script>
  <script defer src="cloud/snailAnimal.js"></script>
  <script defer src="mobile/i18n.js"></script>
  <script defer src="mapping.js"></script>
  <script defer src="snail-sticker.js"></script>
  <script defer src="mobile/ear-code.js"></script>
  <script defer src="mobile/audio.js"></script>
  <script defer src="lib/p5.min.js"></script>
  <script defer src="tower.js"></script>
  <script defer src="mobile/tower-view.js"></script>
  <script defer src="mobile/mobile.js"></script>
</head>
<body>
  <header class="site-header">
    <span data-i18n="work">모든 귀는 [   ] 이다</span>
    <span class="header-end"><span data-i18n="museum">서울시립 북서울미술관</span>
      <span class="lang-switch" role="group" data-i18n-aria="langLabel" aria-label="언어"><button type="button" data-lang-option="ko" lang="ko">KO</button><button type="button" data-lang-option="en" lang="en">EN</button></span></span>
  </header>
  <main>
    <div class="page-title">
      <p class="eyebrow" data-i18n="eyebrow">Cochlea Tower</p>
      <h1 data-i18n="title">청감 타워</h1>
      <a class="text-link" href="#own"><span data-i18n="ownLink">내 달팽이</span> <span aria-hidden="true">↓</span></a>
    </div>
    <section id="explore" class="explore" aria-label="청감 타워 둘러보기" data-i18n-aria="exploreAria">
      <div class="tower-frame">
        <div class="scale" aria-hidden="true"><span><b>20 kHz</b><span data-i18n="high">높은 소리</span></span><i></i><span><b>20 Hz</b><span data-i18n="low">낮은 소리</span></span></div>
        <div id="stage" aria-label="회전하는 청감 타워" data-i18n-aria="towerAria" aria-describedby="tower-help"></div>
        <p id="tower-help"><span aria-hidden="true">↔</span> <span data-i18n="towerHelp">좌우로 돌리고 달팽이를 눌러보세요.</span></p>
      </div>
      <p id="feed-status" class="muted" role="status">타워에 도착한 달팽이를 불러오는 중이에요.</p>
      <details id="ear-picker" open>
        <summary data-i18n="pick">동물별로 귀 고르기</summary>
        <div id="animal-chips" class="animal-chips" role="group" aria-label="동물로 고르기" data-i18n-aria="chipsLabel"></div>
        <div id="ears" class="ear-grid" aria-label="도착한 달팽이" data-i18n-aria="earsLabel"></div>
      </details>
    </section>
    <section id="own" class="own" aria-labelledby="own-title">
      <h2 id="own-title" data-i18n="ownTitle">내 달팽이</h2>
      <form id="code-form">
        <label for="ear-code" data-i18n="codeLabel">청감 코드</label>
        <div class="input-row">
          <input id="ear-code" type="text" placeholder="IWS-RLF" maxlength="32"
            autocomplete="off" autocapitalize="characters" spellcheck="false"
            aria-describedby="code-help code-status">
          <button type="submit" data-i18n="apply">적용</button>
        </div>
        <p id="code-help" class="muted" data-i18n="codeHelp">영문만 입력해도 달팽이가 나타나요. 예시 IWS-RLF(13.2k/6)</p>
        <p id="code-status" class="muted" role="status" hidden></p>
      </form>
      <figure id="own-specimen" class="specimen" hidden>
        <canvas id="own-preview" class="own-preview" width="440" height="248"
          role="img" aria-label="내 청감 코드로 그린 달팽이" data-i18n-aria="ownCanvas"></canvas>
        <figcaption><span id="own-animal" class="own-animal"></span><span id="own-code"></span><span id="own-animal-line" class="own-animal-line"></span></figcaption>
      </figure>
    </section>

    <section id="listen" aria-labelledby="listen-title">
      <a class="text-link back-link" href="#explore"><span aria-hidden="true">↑</span> <span data-i18n="back">타워로 돌아가기</span></a>
      <h2 id="listen-title" tabindex="-1" data-i18n="listenTitle">청각 다변화 장치</h2>
      <p id="comparison" class="muted">타워에서 달팽이를 고르면 그 귀로 들을 수 있어요.</p>
      <a class="text-link" id="enter-code" href="#own" data-i18n="enterCode">내 청감 코드 입력</a>
      <label for="track" data-i18n="soundscape">사운드스케이프</label>
      <select id="track">
        <option value="water" data-i18n="water">당현천 물소리</option>
        <option value="train-go" data-i18n="train-go">중계역 지하철</option>
        <option value="car-move" data-i18n="car-move">북서울미술관 앞 지나가는 차</option>
      </select>
      <div class="listening-switch" role="group" aria-label="들을 귀" data-i18n-aria="switchLabel">
        <button type="button" id="own-listening" aria-pressed="true"><span class="key" aria-hidden="true">A</span><span data-i18n="ownEar">내 귀로 듣기</span></button>
        <button type="button" id="other-listening" aria-pressed="false" disabled><span class="key" aria-hidden="true">B</span><span id="other-ear-label">이 달팽이의 귀로 듣기</span></button>
      </div>
      <audio id="player" playsinline preload="metadata"></audio>
      <div class="playback">
        <button id="play" type="button" disabled>재생</button>
        <div class="timeline">
          <input id="seek" type="range" min="0" max="0" step="0.1" value="0" disabled aria-label="재생 위치" data-i18n-aria="seek">
          <div class="time-labels"><span id="elapsed">0:00</span><span id="duration">–:––</span></div>
        </div>
      </div>
      <p id="audio-status" class="muted" role="status" hidden></p>
    </section>
  </main>
</body>
</html>
