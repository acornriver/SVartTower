<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>청감 타워 · 관객용</title>
  <link rel="stylesheet" href="mobile.css">
  <script defer src="../cloud/schema.js"></script>
  <script defer src="../cloud/config.js"></script>
  <script defer src="../cloud/firebase.js"></script>
  <script defer src="../cloud/feed.js"></script>
  <script defer src="../mapping.js"></script>
  <script defer src="../snail-sticker.js"></script>
  <script defer src="ear-code.js"></script>
  <script defer src="audio.js"></script>
  <script defer src="../lib/p5.min.js"></script>
  <script defer src="../tower.js"></script>
  <script defer src="tower-view.js"></script>
  <script defer src="mobile.js"></script>
</head>
<body>
  <header class="site-header">
    <span>모든 귀는 [   ] 이다</span>
    <span>서울시립 북서울미술관</span>
  </header>
  <main>
    <div class="page-title">
      <p class="eyebrow">Cochlea Tower</p>
      <h1>청감 타워</h1>
      <a class="text-link" href="#own">내 달팽이 <span aria-hidden="true">↓</span></a>
    </div>
    <section id="explore" class="explore" aria-label="청감 타워 둘러보기">
      <div class="tower-frame">
        <div class="scale" aria-hidden="true"><span><b>20 kHz</b>높은 소리</span><i></i><span><b>20 Hz</b>낮은 소리</span></div>
        <div id="stage" aria-label="회전하는 청감 타워" aria-describedby="tower-help"></div>
        <p id="tower-help"><span aria-hidden="true">↔</span> 좌우로 돌리고 달팽이를 눌러보세요.</p>
      </div>
      <p id="feed-status" class="muted" role="status">타워에 도착한 달팽이를 불러오는 중이에요.</p>
      <details>
        <summary>달팽이 목록에서 고르기</summary>
        <div id="ears" class="ear-grid" aria-label="도착한 달팽이"></div>
      </details>
    </section>
    <section id="own" class="own" aria-labelledby="own-title">
      <h2 id="own-title">내 달팽이</h2>
      <form id="code-form">
        <label for="ear-code">청감 코드</label>
        <div class="input-row">
          <input id="ear-code" type="text" placeholder="IWS-RLF" maxlength="32"
            autocomplete="off" autocapitalize="characters" spellcheck="false"
            aria-describedby="code-help code-status">
          <button type="submit">적용</button>
        </div>
        <p id="code-help" class="muted">영문만 입력해도 달팽이가 나타나요. 예시 IWS-RLF(13.2k/6)</p>
        <p id="code-status" class="muted" role="status" hidden></p>
      </form>
      <figure id="own-specimen" class="specimen" hidden>
        <canvas id="own-preview" class="own-preview" width="440" height="248"
          role="img" aria-label="내 청감 코드로 그린 달팽이"></canvas>
        <figcaption id="own-code"></figcaption>
      </figure>
    </section>

    <section id="listen" aria-labelledby="listen-title">
      <a class="text-link back-link" href="#explore"><span aria-hidden="true">↑</span> 타워로 돌아가기</a>
      <h2 id="listen-title" tabindex="-1">청각 다변화 장치</h2>
      <p id="comparison" class="muted">타워에서 달팽이를 고르면 그 귀로 들을 수 있어요.</p>
      <a class="text-link" id="enter-code" href="#own">내 청감 코드 입력</a>
      <label for="track">사운드스케이프</label>
      <select id="track">
        <option value="water">당현천 물소리</option>
        <option value="train-go">중계역 지하철</option>
        <option value="car-move">북서울미술관 앞 지나가는 차</option>
      </select>
      <div class="listening-switch" role="group" aria-label="들을 귀">
        <button type="button" id="own-listening" aria-pressed="true"><span class="key" aria-hidden="true">A</span>내 귀로 듣기</button>
        <button type="button" id="other-listening" aria-pressed="false" disabled><span class="key" aria-hidden="true">B</span>이 달팽이의 귀로 듣기</button>
      </div>
      <audio id="player" playsinline preload="metadata"></audio>
      <div class="playback">
        <button id="play" type="button" disabled>재생</button>
        <div class="timeline">
          <input id="seek" type="range" min="0" max="0" step="0.1" value="0" disabled aria-label="재생 위치">
          <div class="time-labels"><span id="elapsed">0:00</span><span id="duration">–:––</span></div>
        </div>
      </div>
      <p id="audio-status" class="muted" role="status" hidden></p>
    </section>
  </main>
</body>
</html>
